services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solobooks}
      POSTGRES_USER: ${POSTGRES_USER:-solobooks_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-solobooks_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 命名卷首挂时目录属主是 root，postgres(uid 70) 写不进 → 归档持续失败、pg_wal 无限积压。
      # 入口脚本只 chown PGDATA，不会处理这个挂载点。若卷被重建，需一次性修复：
      #   docker compose exec -u root postgres chown postgres:postgres /var/lib/postgresql/wal_archive
      - postgres_wal_archive:/var/lib/postgresql/wal_archive
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # D-008：归档卷 → wal-archive-ship.py 上传 COS → 校验后删本地。
    # 先写 .partial 再原子 mv，避免上传器读到写了一半的段；最终名已存在时用 cmp
    # 比较，保证归档重试幂等。基础备份见 base-backup-postgres.sh。
    # 注意：注释不能写进下面的折叠块里——块标量内的每一行都是 postgres 参数。
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='if test ! -f /var/lib/postgresql/wal_archive/%f; then cp %p /var/lib/postgresql/wal_archive/%f.partial && mv /var/lib/postgresql/wal_archive/%f.partial /var/lib/postgresql/wal_archive/%f; else cmp -s %p /var/lib/postgresql/wal_archive/%f; fi'
      -c archive_timeout=300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solobooks_owner} -d ${POSTGRES_DB:-solobooks}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - solobooks_net

  backend:
    build:
      context: ../
      dockerfile: deploy/backend.Dockerfile
      # 默认清华源（与 Dockerfile ARG 默认一致），海外构建可设 PIP_INDEX_URL 覆盖
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    # --forwarded-allow-ips：生产是「宿主 nginx → 容器 nginx → uvicorn」两跳代理。
    # 不信任转发头时 request.client.host 是 Docker 网关 IP，所有用户共用一个 IP：
    # 短信 60 秒同 IP 限流会变成全站共享，登录失败锁定也会误伤所有人。
    # 只信任环回与 Docker 私网段；uvicorn 从右往左取第一个非信任地址，客户端
    # 自带伪造的 X-Forwarded-For 前缀不会被采信。
    command: >
      sh -c "cd /app && DATABASE_URL=$$MIGRATION_DATABASE_URL alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 80 --proxy-headers --forwarded-allow-ips=127.0.0.1,172.16.0.0/12"
    environment:
      - HOST=0.0.0.0
      - PORT=80
      - CORS_ORIGINS=https://solobooks.cn,https://www.solobooks.cn,http://localhost:8080
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_APP_USER:-solobooks_app}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-solobooks}
      - MIGRATION_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-solobooks_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solobooks}
      # 主体永久删除专用连接（数据库属主）：不可变触发器只对属主放行，
      # 应用角色即使自己设置 solobooks.allow_tenant_purge 也会被拒绝。
      # 与 MIGRATION_DATABASE_URL 同角色、不同驱动（运行时用 asyncpg）。
      - TENANT_PURGE_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-solobooks_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solobooks}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      # LLM 供应商（OpenAI 兼容协议）：默认回落到百炼端点，切换 DeepSeek 等在宿主 .env 配置
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_SEND_ENABLE_THINKING=${LLM_SEND_ENABLE_THINKING:-1}
      - QWEN_TEXT_MODEL=${QWEN_TEXT_MODEL:-}
      - QWEN_VL_MODEL=${QWEN_VL_MODEL:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - WECHAT_APPID=${WECHAT_APPID:-}
      - WECHAT_SECRET=${WECHAT_SECRET:-}
      # 微信开放平台网站应用（PC 扫码登录）：与小程序、微信支付两套配置相互独立
      - WECHAT_WEB_APPID=${WECHAT_WEB_APPID:-}
      - WECHAT_WEB_SECRET=${WECHAT_WEB_SECRET:-}
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID:-}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET:-}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME:-}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE:-}
      # 管理后台安全前提：生产环境必须关闭开发兜底 token（否则垃圾 token 按 test_user_001 放行）
      - AUTH_DEV_FALLBACK=0
      - ACCOUNTING_TIMEZONE=Asia/Shanghai
      # 邮件收单通道（docs/mail-inbound.md）：四项 MAIL_INBOUND_* 配齐才启动 IMAP 轮询，
      # 全部留空 = 功能静默（前端入口显示「收取服务未开通」，不影响手动上传）
      - MAIL_INBOUND_IMAP_HOST=${MAIL_INBOUND_IMAP_HOST:-}
      - MAIL_INBOUND_IMAP_PORT=${MAIL_INBOUND_IMAP_PORT:-993}
      - MAIL_INBOUND_IMAP_USER=${MAIL_INBOUND_IMAP_USER:-}
      - MAIL_INBOUND_IMAP_PASSWORD=${MAIL_INBOUND_IMAP_PASSWORD:-}
      - MAIL_INBOUND_DOMAIN=${MAIL_INBOUND_DOMAIN:-}
      - MAIL_POLL_SECONDS=${MAIL_POLL_SECONDS:-180}
      - MAIL_INBOUND_MAX_ATTACHMENT_MB=${MAIL_INBOUND_MAX_ATTACHMENT_MB:-50}
      # 支付宝收款（docs/alipay-payment-integration.md）：三项配齐才启用支付；
      # ALIPAY_GATEWAY 留空走 config 默认生产网关，沙箱联调在 .env 显式覆盖
      - ALIPAY_APP_ID=${ALIPAY_APP_ID:-}
      - ALIPAY_PRIVATE_KEY=${ALIPAY_PRIVATE_KEY:-}
      - ALIPAY_PUBLIC_KEY=${ALIPAY_PUBLIC_KEY:-}
      - ALIPAY_GATEWAY=${ALIPAY_GATEWAY:-}
      # 微信支付 Native 扫码（第二渠道，docs/billing-runbook.md 微信章节）：
      # 五项配齐才启用渠道；公钥两可选（未配置回退平台证书运行时拉取）
      - WECHAT_PAY_MCH_ID=${WECHAT_PAY_MCH_ID:-}
      - WECHAT_PAY_APP_ID=${WECHAT_PAY_APP_ID:-}
      - WECHAT_PAY_API_V3_KEY=${WECHAT_PAY_API_V3_KEY:-}
      - WECHAT_PAY_SERIAL_NO=${WECHAT_PAY_SERIAL_NO:-}
      - WECHAT_PAY_PRIVATE_KEY=${WECHAT_PAY_PRIVATE_KEY:-}
      - WECHAT_PAY_PUBLIC_KEY=${WECHAT_PAY_PUBLIC_KEY:-}
      - WECHAT_PAY_PUBLIC_KEY_ID=${WECHAT_PAY_PUBLIC_KEY_ID:-}
      - WECHAT_PAY_ORDER_TIMEOUT=${WECHAT_PAY_ORDER_TIMEOUT:-2h}
      # 商业化额度卡口：开源自部署默认 0（不限制）；官方云端 SaaS 设 1 开启免费试用月 10 万 token 限制
      - QUOTA_ENFORCEMENT_ENABLED=${QUOTA_ENFORCEMENT_ENABLED:-0}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 归档件（全账套 XLSX、签发账簿 PDF）必须落在持久卷。否则容器一重建，
      # backup_records 记录还在、文件全丢，历史归档下载直接 410。
      - backend_archives:/app/data/archives
      # 发票电子原件（数电票 XML/PDF/OFD）同理：原件不可变、只增不减，
      # 卷丢了附件行还在但下载 410（见 docs/finance-core-runbook.md「发票电子原件」）。
      - backend_attachments:/app/data/attachments
    restart: unless-stopped
    networks:
      - solobooks_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_API_BASE: ""
        # 默认 npmmirror（与 Dockerfile ARG 默认一致），可设 NPM_REGISTRY 覆盖
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      # 只绑环回：宿主 nginx 反代的正是 127.0.0.1:8080；此前对公网开放 8080
      # 会绕过 TLS 直连容器（待办 P2 收口）
      - "127.0.0.1:${EXTERNAL_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - solobooks_net

volumes:
  postgres_data:
  postgres_wal_archive:
  backend_archives:
  backend_attachments:

networks:
  solobooks_net:
    driver: bridge
