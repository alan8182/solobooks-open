services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solobooks}
      POSTGRES_USER: ${POSTGRES_USER:-solobooks_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-solobooks_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 命名卷首挂时目录属主是 root，postgres(uid 70) 写不进 → 归档持续失败、pg_wal 无限积压。
      # 入口脚本只 chown PGDATA，不会处理这个挂载点。若卷被重建，需一次性修复：
      #   docker compose exec -u root postgres chown postgres:postgres /var/lib/postgresql/wal_archive
      - postgres_wal_archive:/var/lib/postgresql/wal_archive
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
      -c archive_timeout=300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solobooks_owner} -d ${POSTGRES_DB:-solobooks}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - solobooks_net

  backend:
    build:
      context: ../
      dockerfile: deploy/backend.Dockerfile
      # 默认清华源（与 Dockerfile ARG 默认一致），海外构建可设 PIP_INDEX_URL 覆盖
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    command: >
      sh -c "cd /app && DATABASE_URL=$$MIGRATION_DATABASE_URL alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 80"
    environment:
      - HOST=0.0.0.0
      - PORT=80
      - CORS_ORIGINS=https://solobooks.cn,https://www.solobooks.cn,http://localhost:8080
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_APP_USER:-solobooks_app}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-solobooks}
      - MIGRATION_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-solobooks_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solobooks}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      # LLM 供应商（OpenAI 兼容协议）：默认回落到百炼端点，切换 DeepSeek 等在宿主 .env 配置
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_SEND_ENABLE_THINKING=${LLM_SEND_ENABLE_THINKING:-1}
      - QWEN_TEXT_MODEL=${QWEN_TEXT_MODEL:-}
      - QWEN_VL_MODEL=${QWEN_VL_MODEL:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - WECHAT_APPID=${WECHAT_APPID:-}
      - WECHAT_SECRET=${WECHAT_SECRET:-}
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID:-}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET:-}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME:-}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE:-}
      # 管理后台安全前提：生产环境必须关闭开发兜底 token（否则垃圾 token 按 test_user_001 放行）
      - AUTH_DEV_FALLBACK=0
      - ACCOUNTING_TIMEZONE=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - solobooks_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_API_BASE: ""
        # 默认 npmmirror（与 Dockerfile ARG 默认一致），可设 NPM_REGISTRY 覆盖
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "${EXTERNAL_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - solobooks_net

volumes:
  postgres_data:
  postgres_wal_archive:

networks:
  solobooks_net:
    driver: bridge
