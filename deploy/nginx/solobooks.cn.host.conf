# 梭罗记账 (SoloBooks) — solobooks.cn 主域
# 宿主机 nginx 反代到 Docker 栈（compose 只把 8080 绑在 127.0.0.1 环回，不对公网开放）。
# TLS 在宿主层终结，证书由 certbot 管理（/etc/letsencrypt/live/solobooks.cn）。

# www 统一 301 到 apex：
# 微信扫码登录依赖 OAuth 回调、HttpOnly Cookie 与 postMessage 同源；
# www.solobooks.cn 与 solobooks.cn 是两个 origin，混用会导致弹窗回调失效。
server {
    listen 80;
    server_name www.solobooks.cn;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://solobooks.cn$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.solobooks.cn;

    ssl_certificate /etc/letsencrypt/live/solobooks.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solobooks.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / { return 301 https://solobooks.cn$request_uri; }
}

server {
    listen 80;
    server_name solobooks.cn;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name solobooks.cn;

    ssl_certificate /etc/letsencrypt/live/solobooks.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solobooks.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 安全响应头（公网入口统一加；容器内的 location 自己 add_header 时不继承，
    # 因此容器配置里另有同一组非 HSTS 头）。
    # HSTS 先不带 includeSubDomains：避免其他子域尚未上 HTTPS 时被浏览器锁死。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # MCP 端点（Streamable HTTP / SSE 流式）：禁缓冲 + 长读超时，
    # 与容器内 nginx 的 /mcp 配置保持一致（双层代理各管各的缓冲）。
    # 用正则锚定 /mcp 与 /mcp/*：裸 location /mcp 是前缀匹配，会把 /mcp-guide
    # 这类前端路由也代理到后端（SPA 页面直接 404）。
    location ~ ^/mcp(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
    }

    # 其余全部（SPA、/api、静态资源）交给容器 nginx 按内部规则分发
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 20m;
    }
}
