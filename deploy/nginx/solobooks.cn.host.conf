# 梭罗记账 (SoloBooks) — solobooks.cn 主域
# 宿主机 nginx 反代到 Docker 栈（compose 映射 127.0.0.1 之外的全部网卡 8080）。
# TLS 在宿主层终结，证书由 certbot 管理（/etc/letsencrypt/live/solobooks.cn）。

server {
    listen 80;
    server_name solobooks.cn www.solobooks.cn;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name solobooks.cn www.solobooks.cn;

    ssl_certificate /etc/letsencrypt/live/solobooks.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solobooks.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # MCP 端点（Streamable HTTP / SSE 流式）：禁缓冲 + 长读超时，
    # 与容器内 nginx 的 /mcp 配置保持一致（双层代理各管各的缓冲）。
    # 用正则锚定 /mcp 与 /mcp/*：裸 location /mcp 是前缀匹配，会把 /mcp-guide
    # 这类前端路由也代理到后端（SPA 页面直接 404）。
    location ~ ^/mcp(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
    }

    # 其余全部（SPA、/api、静态资源）交给容器 nginx 按内部规则分发
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 20m;
    }
}
