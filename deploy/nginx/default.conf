server {
    listen 80;
    server_name _;
    charset utf-8;

    # ---- API reverse proxy ----
    location /api/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;

        client_max_body_size 20M;
    }

    # ---- Immutable asset cache ----
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- Favicon / static files ----
    # webp：站内操作指引截图（public/guides/**），没有它就只能落进 location /，
    # 功能正常但每次访问都 no-cache 重下（单张 30–55KB，个税一篇 9 张）
    location ~* \.(ico|svg|webmanifest|png|jpg|webp)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---- MCP endpoint (Streamable HTTP, may stream SSE) ----
    # 禁用缓冲保证 SSE 事件即时到达；读超时放宽到 10 分钟容纳长会话。
    # 正则锚定 /mcp 与 /mcp/*：裸 location /mcp 是前缀匹配，会把 /mcp-guide
    # 这类前端路由也代理到后端，SPA 页面会 404。
    location ~ ^/mcp(/|$) {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
    }

    # ---- SPA entry point ----
    # 详见根目录《SEO搜索优化落地计划》P0-4：消除软 404。
    # 已知前端一级路由回退 index.html（200，交给客户端路由接管）；
    # 未知路径返回真实 404 状态，error_page 让浏览器仍拿到应用壳、由前端兜底路由
    # 渲染 NotFound，但搜索引擎拿到的是干净的状态码。
    # ⚠️ 新增一级路由时必须同步追加到下面的正则，否则该路由直连访问会带 404 状态
    # （页面仍能渲染，但对爬虫等同死链）。
    location ~ ^/(login|landing|landing-v2|audit-scan|health-scan|agreement|privacy|ai-connect|docs|mcp-skills|share|console|guide|guides|ledger|invoices|record|reports|rd-expenses|vouchers|assets|intangibles|todos|copilot|tax-filing|tax-registration|mine|private-expenses|aggregation|bank|closing-wizard)(/|$) {
        root /usr/share/nginx/html;
        # $uri 命中预渲染产物文件；$uri/index.html 直接命中目录式产物且不触发
        # 补斜杠 301（$uri/ 会先 301 到带斜杠版本）；都没有才回退应用壳
        # index.html（未预渲染的路由，如 /login、工作台深链）
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # $uri/index.html 直接命中静态目录产物（/learn、/learn/<slug>），不触发补斜杠 301
        try_files $uri $uri/index.html =404;
        # 404 兜底是独立静态页（public/404.html，带 noindex），不再回退应用壳：
        # 预渲染后应用壳即完整官网内容，配 404 状态会变成「有内容的软 404」，干扰搜索引擎判定
        error_page 404 /404.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
