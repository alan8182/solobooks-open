<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>梭罗记账 SoloBooks —— 不做糊涂账，合规用梭罗</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Inter", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: #F6F7F9;
      background-image:
        radial-gradient(circle at 82% 20%, rgba(23, 71, 176, 0.06) 0%, transparent 48%),
        radial-gradient(circle at 1px 1px, rgba(24, 34, 48, 0.05) 1px, transparent 0);
      background-size: 100% 100%, 40px 40px;
      color: #182230;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 120px;
      -webkit-font-smoothing: antialiased;
    }

    .left-col {
      width: 820px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 40px;
    }
    .brand-logo {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      border: 1px solid #DDE3EA;
      box-shadow: 0 8px 20px rgba(23, 71, 176, 0.12);
    }
    .brand-name-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .brand-cn {
      font-size: 32px;
      font-weight: 700;
      color: #182230;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .brand-en {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #1747B0;
      text-transform: uppercase;
    }
    .brand-meta {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 500;
      color: #586474;
    }

    .headline {
      font-size: 72px;
      font-weight: 800;
      line-height: 1.16;
      letter-spacing: -0.03em;
      color: #182230;
      margin-bottom: 26px;
    }
    .headline-accent {
      color: #1747B0;
    }

    .subtitle {
      font-size: 24px;
      font-weight: 400;
      line-height: 1.55;
      color: #586474;
      max-width: 680px;
      margin-bottom: 44px;
    }

    .specs-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .spec-pill {
      padding: 11px 18px;
      background: #FFFFFF;
      border: 1px solid #DDE3EA;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #182230;
      box-shadow: 0 1px 3px rgba(24, 34, 48, 0.04);
    }

    .right-col {
      width: 740px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .focus-card {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #DDE3EA;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 24px 60px -16px rgba(24, 34, 48, 0.10);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .card-title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-kicker {
      font-size: 13px;
      font-weight: 600;
      color: #1747B0;
      letter-spacing: 0.04em;
    }
    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: #182230;
    }
    .verified-badge {
      padding: 8px 14px;
      border-radius: 999px;
      background: #EAF7F1;
      color: #0F7354;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .tx-box {
      background: #F6F7F9;
      border: 1px solid #EDF0F4;
      border-radius: 14px;
      padding: 26px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .tx-name {
      font-size: 21px;
      font-weight: 700;
      color: #182230;
    }
    .tx-sub {
      margin-top: 6px;
      font-size: 15px;
      color: #586474;
    }
    .tx-right {
      text-align: right;
    }
    .tx-amount {
      font-size: 28px;
      font-weight: 700;
      color: #182230;
      font-variant-numeric: tabular-nums;
    }
    .tx-account {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #1747B0;
    }

    .meta-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
    }
    .meta-item {
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid #EDF0F4;
      background: #FFFFFF;
    }
    .meta-label {
      font-size: 13px;
      font-weight: 600;
      color: #636E7C;
      margin-bottom: 4px;
    }
    .meta-val {
      font-size: 15px;
      font-weight: 600;
      color: #182230;
      line-height: 1.4;
    }

    .cta-bar {
      width: 100%;
      padding: 18px 26px;
      border-radius: 12px;
      background: #1747B0;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 600;
      box-shadow: 0 10px 24px -6px rgba(23, 71, 176, 0.32);
    }
    .cta-chip {
      font-size: 14px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.16);
    }

    .card-foot {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: #636E7C;
    }
  </style>
</head>
